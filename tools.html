    <style>
      /* 工具箱局部样式 */
      .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .875rem; margin-bottom: 1.75rem; }
      .tool-card { display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; text-align: left; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.125rem; cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; font: inherit; }
      .tool-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-pop); transform: translateY(-2px); }
      .tool-card.active { border-color: var(--color-primary); background: var(--color-primary-soft); }
      .tool-card .tc-icon { width: 2.25rem; height: 2.25rem; border-radius: 10px; background: var(--color-primary-soft); color: var(--color-primary-deep); display: flex; align-items: center; justify-content: center; flex: none; }
      .tool-card.active .tc-icon { background: var(--gradient-primary); color: #fff; }
      .tool-card .tc-name { font-weight: 700; font-size: .9375rem; color: var(--color-text); }
      .tool-card .tc-desc { font-size: .8125rem; color: var(--color-muted-text); line-height: 1.5; }
      .tool-panel { display: none; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem; }
      .tool-panel.active { display: block; }
      .panel-head { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
      .panel-head h2 { margin: 0; font-size: 1.125rem; font-weight: 700; }
      .panel-head p { margin: .125rem 0 0; font-size: .8125rem; color: var(--color-muted-text); }
      .panel-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .875rem; align-items: end; margin-bottom: 1rem; }
      .panel-form .field label { display: block; font-size: .8125rem; font-weight: 600; margin-bottom: .375rem; color: var(--color-primary-deep); }
      .panel-form .field input, .panel-form .field select { width: 100%; }
      .tool-result { border-top: 1px dashed var(--color-border); padding-top: 1rem; margin-top: .5rem; }
      .tool-result[data-state="default"] { border: 0; padding: 0; margin: 0; color: var(--color-muted-text); font-size: .875rem; }
      .tool-result .result-box { white-space: pre-line; background: var(--color-primary-soft); border-radius: 10px; padding: 1rem 1.125rem; font-size: .9375rem; line-height: 1.8; color: var(--color-primary-deep); }
      .tool-history { margin-top: 1rem; border-top: 1px dashed var(--color-border); padding-top: .875rem; }
      .tool-history .hist-title { font-size: .8125rem; font-weight: 700; color: var(--color-primary-deep); margin-bottom: .5rem; }
      .tool-history .hist-list { display: flex; flex-direction: column; gap: .375rem; max-height: 220px; overflow: auto; }
      .tool-history .hist-item { display: flex; align-items: center; gap: .625rem; width: 100%; text-align: left; border: 1px solid var(--color-border); border-radius: 8px; background: transparent; padding: .375rem .625rem; font-size: .8125rem; cursor: pointer; }
      .tool-history .hist-item:hover { background: var(--color-primary-soft); }
      .tool-history .hi-ts { flex: none; color: var(--color-muted-text); font-variant-numeric: tabular-nums; }
      .tool-history .hi-theme { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text); }
      .gen-btn { justify-self: start; }

    </style>

    <script>
      (function () {
        var toggle = document.querySelector('.menu-toggle');
        var nav = document.getElementById('mobile-nav');
        if (toggle && nav) {
          toggle.addEventListener('click', function () {
            var open = nav.style.display === 'flex';
            nav.style.display = open ? 'none' : 'flex';
            toggle.setAttribute('aria-expanded', String(!open));
          });
        }

        /* ===== 真实 AI 生成：复用 settings/ai-short 的智谱配置（localStorage rgyw_ai_config） ===== */
        var AI_STORAGE_KEY = 'rgyw_ai_config';
        var AI_DEFAULT_CONFIG = {
          apiBase: 'https://open.bigmodel.cn/api/paas/v4',
          apiKey: 'YOUR_API_KEY',
          model: 'glm-4-flash',
          maxTokens: '4096'
        };
        function getAiConfig() {
          try { var raw = localStorage.getItem(AI_STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
          return AI_DEFAULT_CONFIG;
        }
        function callChatApi(config, messages, onChunk, onDone, onErr) {
          try {
            var url = config.apiBase.replace(/\/+$/, '') + '/chat/completions';
            fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + config.apiKey },
              body: JSON.stringify({
                model: config.model,
                messages: messages,
                max_tokens: parseInt(config.maxTokens) || 4096,
                stream: true
              })
            }).then(function (resp) {
              if (!resp.ok) {
                return resp.text().then(function (txt) { onErr('请求失败（HTTP ' + resp.status + '）：' + txt.slice(0, 200)); });
              }
              var reader = resp.body.getReader();
              var decoder = new TextDecoder();
              var buffer = '';
              var fullText = '';
              function pump() {
                return reader.read().then(function (_r) {
                  if (_r.done) { onDone(fullText); return; }
                  buffer += decoder.decode(_r.value, { stream: true });
                  var lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (!line || line.indexOf('data:') !== 0) continue;
                    var data = line.slice(5).trim();
                    if (data === '[DONE]') { onDone(fullText); return; }
                    try {
                      var json = JSON.parse(data);
                      var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
                      if (delta) { fullText += delta; onChunk(fullText); }
                    } catch (e2) {}
                  }
                  return pump();
                });
              }
              return pump();
            }).catch(function (e) {
              onErr('网络错误：' + e.message);
            });
          } catch (e) {
            onErr('调用错误：' + e.message);
          }
        }
        function buildMessages(toolId, v) {
          var type = v.type || '';
          var theme = v.theme || '';
          var user = '类型/定位：' + (type || '未指定') + '\n关键词/主题：' + (theme || '未指定');
          var sys;
          switch (toolId) {
            case 'book': sys = '你是资深网文书名策划。根据作品类型与主题词，生成 5 个吸睛的书名，每行一个「《书名》」，要包含核心爽点或身份反差，避免雷同。直接输出，不要解释。'; break;
            case 'intro': sys = '你是网文简介撰稿人。根据作品类型与主题，生成 3 段简介，每段 100-150 字，标注【简介一】【简介二】【简介三】，突出主角、悬念与爽点。直接输出，不要解释。'; break;
            case 'outline': sys = '你是网文大纲架构师。根据故事主线，生成三卷大纲，格式：第一卷「卷名」：3-5 条要点；第二卷…第三卷…，覆盖起承转合、关键高潮与反转。直接输出，不要解释。'; break;
            case 'detail': sys = '你是网文细纲写手。根据本章主题，生成一章细纲：分 4-6 个场景，每个场景含【场景名】【地点】【人物】【冲突/推进】【结尾钩子】。直接输出，不要解释。'; break;
            case 'opener': sys = '你是网文黄金三章专家。根据作品类型与主角设定，写一段 250-350 字的开篇，第一句必须有冲击力，埋下悬念或冲突，结尾留钩子。直接输出正文，不要解释。'; break;
            case 'cheat': sys = '你是网文金手指设计师。根据主角处境，设计 3 个金手指，每个标注【金手指一/二/三】：名称、核心能力、代价或限制、成长空间。直接输出，不要解释。'; break;
            case 'name': sys = '你是起名专家。根据性别与姓氏/关键词，生成 6 个有辨识度的角色名，每行一个「名字 —— 寓意/气质」，风格贴合关键词。直接输出，不要解释。'; break;
            case 'char': sys = '你是人设塑造师。根据角色定位与关键词，输出一张人设卡：姓名、性格底色、核心欲望、致命弱点、人物弧光、标志性动作、口头禅。直接输出，不要解释。'; break;
            case 'cover': sys = '你是网文封面设计师。根据作品类型与书名/元素，给出 3 个封面创意方案，每个含【方案一/二/三】：画面主体、主色调、字体风格、构图建议。直接输出，不要解释。'; break;
            case 'idea': sys = '你是网文脑洞策划。根据题材关键词，发散 3 个新颖的故事脑洞，用【脑洞一】【脑洞二】【脑洞三】标注，每个 2-3 句话，题材贴合、有反转、有新意，避免老套模板。直接输出，不要解释。'; break;
            case 'test': sys = '你是网文市场编辑。对给出的书名做测试报告：热度评分（/100）、辨识度、记忆点、目标读者、优化建议（2-3 条）。直接输出，不要解释。'; break;
            case 'world': sys = '你是世界观架构师。根据作品类型与核心设定，构建世界观：时代背景、社会结构、核心矛盾、独特设定、力量体系（如适用）。直接输出，不要解释。'; break;
            case 'bench': sys = '你是爆款拆解分析师。拆解给出的对标作品：核心套路、爽点设计、节奏结构、人物塑造、可借鉴点、创新建议。直接输出，不要解释。'; break;
            default: sys = '你是资深网文创作助手，根据输入生成高质量创作素材。直接输出，不要解释。';
          }
          return [{ role: 'system', content: sys }, { role: 'user', content: user }];
        }

        function brainstormIdeas(theme) {
          var kw = String(theme || '').split(/[,，、;；\/\s]+/).filter(Boolean);
          var s = kw.join('');
          var has = function (a) { for (var i = 0; i < a.length; i++) if (s.indexOf(a[i]) > -1) return true; return false; };
          var pick = function (a) { return a[(Math.random() * a.length) | 0]; };
          var k = kw.length ? kw : ['穿越'];
          var t = k.join('、');
          var isLove = has(['追妻', '火葬场', '虐', '爱情', '恋爱', '情缘', '道侣', '悔婚', '渣', '前任', '白月光']);
          var isXian = has(['修仙', '仙侠', '玄幻', '宗', '剑', '飞升', '灵', '魔', '道', '神', '妖', '丹']);
          var isUrban = has(['都市', '现代', '职场', '总裁', '豪门', '医院', '娱乐圈', '商战']);
          var isXuan = has(['悬疑', '推理', '灵异', '鬼', '侦探', '案件', '凶']);
          var isKe = has(['科幻', '星际', '末世', '机甲', '赛博', 'AI', '未来', '废土']);
          var isSchol = has(['读书', '科举', '书生', '功名', '状元', '赶考', '朝堂', '文人', '诗词', '八股', '寒门', '殿试', '进士']);
          var scenes = ['宗门大典', '宗门大比', '婚礼现场', '登基大典', '毕业典礼', '家族晚宴', '末日降临', '拍卖会', '寿宴', '试炼大会'];
          var twistPool = ['这场大典本身就是一场献祭', '所有人都在配合演同一场戏', '幕后黑手一直就在自己身边', '自己才是那个被选中的祭品', '所谓的天选者另有其人'];
          var worldA = isXian ? '修仙界' : isUrban ? '都市' : isKe ? '星际联邦' : isXuan ? '这座城' : '这方天地';
          var identA = isXian ? '剑修' : isUrban ? '商界大佬' : isKe ? '王牌舰长' : isXuan ? '传奇神探' : '高手';
          var dailyPool = isXian ? ['被迫下山卖灵茶', '被迫给师侄当陪练', '被迫参加凡人厨艺大赛'] : isUrban ? ['被迫回老家开火锅店', '被迫当全职奶爸', '被迫去夜市摆摊'] : isKe ? ['被迫去废土捡垃圾', '被迫给AI当心理医生', '被迫在空间站当客服'] : isXuan ? ['被迫经营一家深夜书店', '被迫接手祖父的侦探社', '被迫在灵异直播间当主播'] : ['被迫切牛肉', '被迫带娃', '被迫扫大街'];
          var eventPool = isXian ? ['卷入上古秘境的争夺', '撞破一场惊天阴谋', '被卷入正魔大战'] : isUrban ? ['卷入灵异食客事件', '被拉进神秘商业局', '撞破豪门丑闻'] : isKe ? ['卷入星际海盗的阴谋', '发现被遗忘的殖民星信号', '被卷入AI叛乱'] : isXuan ? ['卷入连环失踪案', '发现旧案的真相', '被拖入一场死亡游戏'] : ['卷入灵异食客事件', '被拉进一场诡异赌局', '撞破惊天的秘密'];
          var out = ['基于「' + t + '」的 3 个脑洞：'];
          if (isLove) {

            '未来科幻': '公民 → 领航员 → 舰长 → 执政官 → 星主，权限逐级解锁',
            '悬疑推理': '目击者 → 证人 → 嫌疑 → 真凶，认知越深，越接近深渊',
            '古风仙侠': '炼气 → 筑基 → 金丹 → 元婴 → 化神，一步一劫',
            '浪漫爱情': '初见 → 心动 → 暧昧 → 误会 → 和解 → 相守',
            '青春校园': '同桌 → 朋友 → 挚友 → 恋人，一步之遥，万水千山',
            '赛博朋克': '灰区 → 黑市 → 上层区 → 云端，阶层即牢笼',
            '西方魔幻': '学徒 → 法师 → 大法师 → 传奇，魔力即命运'
          };
          var forces = {
            '东方玄幻': '一宗两阁三世家，表面同气连枝，暗中互相倾轧',
            '现代都市': '官方觉醒者协会与地下暗网势力，明争暗斗',
            '未来科幻': '联邦议会与星际海盗，秩序与混沌并存',
            '悬疑推理': '老牌警局与地下情报掮客，真相被层层掩埋',
            '古风仙侠': '正道七宗与魔道五脉，千年来互有胜负',
            '浪漫爱情': '两个家族、两段旧怨，横亘在两人之间',
            '青春校园': '重点班与普通班、校方与社团，青春自有江湖',
            '赛博朋克': '巨型企业与街头帮派，赛博世界的光与影',
            '西方魔幻': '光明教会与黑暗议会，千年圣战从未停歇'
          };
          var tabs = ['灵气越浓郁的地方，机缘越多，争斗也越残酷', '规则越是森严的地方，暗处的交易越是疯狂', '越靠近权力核心，代价越沉重，真相越稀少', '所有人都在追逐的东西，往往只是上层设下的饵'];
          var ban = ['帝境之上有「天」的存在，触及者皆消失', '这座城市里，「失踪」比「死亡」更常见', '那扇门后的一切，被所有势力心照不宣地抹去', '禁忌之所以是禁忌，是因为有人曾经试过'];
          return '「' + t + '」世界观框架：\n时代背景：' + main + '。\n力量体系：' + (systems[t] || systems['东方玄幻']) + '。\n势力格局：' + (forces[t] || forces['东方玄幻']) + '。\n核心规则：' + tabs[(Math.random() * tabs.length) | 0] + '。\n禁忌设定：' + ban[(Math.random() * ban.length) | 0] + '。';
        }

        function brainBench(th) {
          var main = th || '斗破苍穹';
          var opens = ['三章内完成「低谷设定 + 金手指 + 第一个打脸」，节奏极快', '开局即冲突，用一场「羞辱」快速立住主角处境', '第一章就亮出金手指规则，让读者快速进入期待', '用「退婚/被逐」制造情绪钩子，开局即爽点'];
          var mains = ['升级-挑战-打脸循环，每卷一个明确大目标', '地图逐步开放：小地方 → 大舞台 → 天下棋局', '配角工具化：每个阶段的对手都是下一阶段的路标', '感情线克制推进，主线永远优先于支线'];
          var rhythms = ['每 3-5 章一个小高潮，每卷一个大高潮', '爽点密度高：每章至少一个「期待-满足」闭环', '打脸讲究层层递进，先小后大，最后反转全场'];
          var learns = ['金手指带成长代价，升级才有实感', '配角的工具化使用，出场即功能', '地图逐步开放，保持新鲜感', '每卷收束伏笔的同时，埋下新的钩子'];
          var news = ['避免同质化，建议在开局方式、金手指规则上做差异', '可以在「爽点节奏」上做变化：前期加速、后期放慢', '建议把最反套路的设计放在开局三章，快速建立辨识度'];
          return '《' + main + '》拆解报告：\n【开局】' + opens[(Math.random() * opens.length) | 0] + '。\n【主线】' + mains[(Math.random() * mains.length) | 0] + '。\n【爽点节奏】' + rhythms[(Math.random() * rhythms.length) | 0] + '。\n【可借鉴】' + learns[(Math.random() * learns.length) | 0] + '。\n【可创新】' + news[(Math.random() * news.length) | 0] + '。';
        }

        var TYPES = ['东方玄幻', '现代都市', '未来科幻', '悬疑推理', '古风仙侠', '浪漫爱情', '青春校园', '赛博朋克', '西方魔幻'];
        var ICONS = ['书', '介', '纲', '细', '开', '金', '名', '人', '封', '脑', '测', '世', '对'];
        var tools = [
          { id: 'book', name: '书名生成器', desc: '创造吸引眼球的标题，让读者第一眼就被吸引', fields: [['select', 'type', '作品类型', TYPES], ['input', 'theme', '主题词', '如：废柴逆袭、仙帝归来']], generate: function (v) { return brainBook(v.type, v.theme); } },
          { id: 'intro', name: '简介生成器', desc: '简洁有力的内容概述，让读者迫不及待想了解更多', fields: [['select', 'type', '作品类型', TYPES], ['input', 'theme', '故事主题', '如：少年复仇、末世求生']], generate: function (v) { return brainIntro(v.type, v.theme); } },
          { id: 'outline', name: '大纲生成器', desc: '构建完整的故事脉络，让创作有条不紊', fields: [['input', 'theme', '故事主线', '如：废材少年集齐七把神剑']], generate: function (v) { return brainOutline(v.theme); } },
          { id: 'detail', name: '细纲生成器', desc: '规划每个章节的细节，为创作提供清晰路线图', fields: [['input', 'theme', '本章主题', '如：主角初入宗门，遭遇刁难']], generate: function (v) { return brainDetail(v.theme); } },
          { id: 'opener', name: '黄金开篇生成器', desc: '创作引人入胜的开头，一开篇就抓住读者', fields: [['select', 'type', '作品类型', TYPES], ['input', 'theme', '主角设定', '如：被废丹田的剑修']], generate: function (v) { return brainOpener(v.type, v.theme); } },
          { id: 'cheat', name: '金手指生成器', desc: '设计出人意料的金手指，让故事充满惊喜', fields: [['input', 'theme', '主角处境', '如：穿越到弱肉强食的修仙界']], generate: function (v) { return brainCheat(v.theme); } },
          { id: 'name', name: '名字生成器', desc: '为角色、地点和物品创建独特而贴切的名称', fields: [['select', 'type', '性别', ['男', '女', '中性']], ['input', 'theme', '姓氏/关键词', '如：林、苏（可留空）']], generate: function (v) { return brainName(v.type, v.theme); } },
          { id: 'char', name: '人设生成器', desc: '打造立体饱满的角色形象，让角色栩栩如生', fields: [['select', 'type', '角色定位', ['主角', '反派', '配角', '女主/男主']], ['input', 'theme', '角色关键词', '如：清冷、隐忍、扮猪吃虎']], generate: function (v) { return brainChar(v.type, v.theme); } },
          { id: 'cover', name: '封面生成', desc: '为作品生成封面创意方案', fields: [['select', 'type', '作品类型', TYPES], ['input', 'theme', '书名/元素', '如：九霄剑帝']], generate: function (v) { return brainCover(v.type, v.theme); } },
          { id: 'idea', name: '脑洞生成', desc: '从题材关键词发散故事脑洞', fields: [['input', 'theme', '题材关键词', '如：时间循环、宗门、火锅店']], generate: function (v) { return brainstormIdeas(v.theme); } },
          { id: 'test', name: '书名测试', desc: '评估书名吸引力并给出优化建议', fields: [['input', 'theme', '输入书名', '如：万古剑帝']], generate: function (v) { var n = v.theme || '未命名'; var score = 60 + ((n.length * 7) % 35); var tip = score > 80 ? '书名辨识度高，关键词明确，很有爆款潜质。' : (score > 65 ? '书名尚可，建议强化「主角身份/核心爽点」的关键词。' : '书名偏平淡，建议加入「万古/都市/开局/归来」等高点击词。'); return '《' + n + '》测试报告：\n热度评分：' + score + '/100\n辨识度：' + (score > 75 ? '高' : '中') + '　记忆点：' + (n.length <= 6 ? '好记' : '偏长') + '\n优化建议：' + tip; } },
          { id: 'world', name: '世界观生成', desc: '构建独特的故事背景设定', fields: [['select', 'type', '作品类型', TYPES], ['input', 'theme', '核心设定', '如：灵气复苏后的宗门时代']], generate: function (v) { return brainWorld(v.type, v.theme); } },
          { id: 'bench', name: '对标爆款', desc: '拆解热门作品结构与写作技巧', fields: [['input', 'theme', '对标作品', '如：斗破苍穹']], generate: function (v) { return brainBench(v.theme); } }
        ];

        var grid = document.getElementById('tool-grid');
        var wrap = document.getElementById('tool-panel-wrap');
        var current = 'book';

        function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

        function renderGrid() {
          grid.innerHTML = '';
          tools.forEach(function (t, i) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'tool-card' + (t.id === current ? ' active' : '');
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-selected', String(t.id === current));
            btn.dataset.tool = t.id;
            btn.innerHTML = '<span class="tc-icon" aria-hidden="true">' + ICONS[i] + '</span><span class="tc-name">' + t.name + '</span><span class="tc-desc">' + t.desc + '</span>';
            btn.addEventListener('click', function () { selectTool(t.id); });
            grid.appendChild(btn);
          });
        }

        /* ===== 生成历史持久化：localStorage 快存 + 服务端 data/tools.json 备份 ===== */
        var TOOLS_HIST_KEY = 'rgyw_tools_history_v1';
        var _thTimer = null;
        function getToolHistories() {
          try { var raw = localStorage.getItem(TOOLS_HIST_KEY); if (raw) { var arr = JSON.parse(raw); if (Array.isArray(arr)) return arr; } } catch (e) {}
          return [];
        }
        function saveToolHistory(toolId, values, result) {
          var arr = getToolHistories();
          arr.push({ tool: toolId, values: values, result: result, ts: Date.now() });
          if (arr.length > 100) arr = arr.slice(arr.length - 100);
          try { localStorage.setItem(TOOLS_HIST_KEY, JSON.stringify(arr)); } catch (e) {}
          clearTimeout(_thTimer);
          _thTimer = setTimeout(function () {
            try {
              if (window.RGData) { RGData.set('tools', { history: getToolHistories(), savedAt: new Date().toISOString() }); }
            } catch (e) {}
          }, 500);
        }
        function renderToolHistory(toolId, box) {
          if (!box) return;
          var items = getToolHistories().filter(function (h) { return h.tool === toolId; }).slice(-8).reverse();
          if (!items.length) { box.innerHTML = ''; return; }
          var html = '<div class="hist-title">最近生成历史（点击可回看）</div><div class="hist-list">';
          items.forEach(function (h, i) {
            var theme = '';
            var v = h.values || {};
            for (var k in v) { if (v[k]) { theme = v[k]; break; } }
            var d = new Date(h.ts);
            var ts = (d.getMonth() + 1) + '-' + d.getDate() + ' ' + (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
            html += '<button type="button" class="hist-item" data-hi="' + i + '"><span class="hi-ts">' + ts + '</span><span class="hi-theme">' + escapeHtml(String(theme).slice(0, 24)) + '</span></button>';
          });
          html += '</div>';
          box.innerHTML = html;
          box.querySelectorAll('.hist-item').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var idx = Number(btn.getAttribute('data-hi'));
              var h = getToolHistories().filter(function (x) { return x.tool === toolId; }).slice(-8).reverse()[idx];
              if (!h) return;
              var rb = document.querySelector('[data-result="' + toolId + '"]');
              if (rb) { rb.setAttribute('data-state', 'complete'); rb.innerHTML = '<div class="result-box">' + escapeHtml(h.result) + '</div>'; }
            });
          });
        }
        function backfillFields(toolId) {
          var arr = getToolHistories().filter(function (h) { return h.tool === toolId; });
          if (!arr.length) return;
          var v = (arr[arr.length - 1].values) || {};
          for (var k in v) {
            var el = document.getElementById('f-' + toolId + '-' + k);
            if (el) el.value = v[k];
          }
        }
        function restoreToolsFromServer() {
          try {
            if (!window.RGData) return;
            RGData.get('tools').then(function (r) {
              var res = (r && r.source === 'server') ? { ok: true, data: r.data } : null;
              if (!res || !res.ok || !res.data || !res.data.history || !Array.isArray(res.data.history)) return;
              var local = getToolHistories();
              var localSaved = '';
              try { var lw = JSON.parse(localStorage.getItem('rgyw_tools_savedat') || 'null'); localSaved = lw || ''; } catch (e) {}
              var needMerge = (res.data.savedAt || '') > localSaved;
              if (!needMerge && local.length) return;
              if (needMerge && res.data.history.length) {
                var map = {};
                local.forEach(function (h) { map[h.tool + '|' + h.ts] = 1; });
                res.data.history.forEach(function (h) { if (h && !map[h.tool + '|' + h.ts]) local.push(h); });
                try { localStorage.setItem(TOOLS_HIST_KEY, JSON.stringify(local)); } catch (e2) {}
              }
              try { localStorage.setItem('rgyw_tools_savedat', JSON.stringify(res.data.savedAt || '')); } catch (e2) {}
              renderToolHistory(current, document.querySelector('[data-history="' + current + '"]'));
            }).catch(function () {});
          } catch (e) {}
        }

        function renderPanel() {
          var t = tools.filter(function (x) { return x.id === current; })[0];
          var fieldsHtml = t.fields.map(function (f) {
            var kind = f[0], key = f[1], label = f[2], ph = f[3] || '';
            var control;
            if (kind === 'select') {
              var opts = ph.map(function (o) { return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + '</option>'; }).join('');
              control = '<select data-ctl="' + key + '">' + opts + '</select>';
            } else {
              control = '<input data-ctl="' + key + '" type="text" placeholder="' + escapeHtml(ph) + '" autocomplete="off" />';
            }
            return '<div class="field"><label data-lbl="' + key + '">' + label + '</label>' + control + '</div>';
          }).join('');
          wrap.innerHTML =
            '<div class="tool-panel active" role="tabpanel" data-tool-panel="' + t.id + '">' +
              '<div class="panel-head"><h2>' + t.name + '</h2><p>' + t.desc + '</p></div>' +
              '<form class="panel-form" data-form="' + t.id + '" aria-label="' + t.name + '参数">' + fieldsHtml +
                '<button class="btn btn-primary gen-btn" type="submit">生成</button>' +
              '</form>' +
              '<div class="tool-result" data-state="default" data-result="' + t.id + '">选择参数后点击「生成」，为你产出创作素材。</div>' +
              '<div class="tool-history" data-history="' + t.id + '"></div>' +
            '</div>';
          // 动态建立 label 与控件关联，避免模板拼接被静态解析
          wrap.querySelectorAll('[data-ctl]').forEach(function (el) {
            var key = el.dataset.ctl;
            el.id = 'f-' + t.id + '-' + key;
            var lbl = wrap.querySelector('[data-lbl="' + key + '"]');
            if (lbl) lbl.setAttribute('for', el.id);
          });
          backfillFields(t.id);
          renderToolHistory(t.id, wrap.querySelector('[data-history="' + t.id + '"]'));
          wrap.querySelector('[data-form]').addEventListener('submit', function (e) {
            e.preventDefault();
            var values = {};
            t.fields.forEach(function (f) {
              var el = document.getElementById('f-' + t.id + '-' + f[1]);
              values[f[1]] = el.value.trim();
            });
            var box = document.querySelector('[data-result="' + t.id + '"]');
            box.setAttribute('data-state', 'loading');
            box.innerHTML = 'AI 生成中…（首次调用稍慢）';
            var config = getAiConfig();
            var msgs = buildMessages(t.id, values);
            callChatApi(config, msgs,
              function (full) {
                box.innerHTML = '<div class="result-box">' + escapeHtml(full) + '</div>';
              },
              function (full) {
                box.setAttribute('data-state', 'complete');
                box.innerHTML = '<div class="result-box">' + escapeHtml(full) + '</div>';
                saveToolHistory(t.id, values, full);
                renderToolHistory(t.id, wrap.querySelector('[data-history="' + t.id + '"]'));
              },
              function (err) {
                box.setAttribute('data-state', 'error');
                box.innerHTML = '<div class="result-box">生成失败：' + escapeHtml(err) + '<br>请在「设置」页检查 AI 接口配置（apiBase / apiKey / model），或确认网络可用。</div>';
              }
            );
          });
        }

        function selectTool(id) { current = id; renderGrid(); renderPanel(); }
        renderGrid();
        renderPanel();
        restoreToolsFromServer();

      })();
    </script>
  </body>
</html>
